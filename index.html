<!doctype html>
<html lang="en" class="pwa"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FORMA Field Terminal</title>
<meta name="theme-color" content="#191b16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FORMA">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&family=VT323&display=swap">
<style>[hidden]{display:none!important}img{max-width:100%}
/* Layout: one handheld field terminal. A riveted gunmetal shell (header plate + key row)
   frames a curved phosphor CRT; every view scrolls inside the glass. Single dark world by design. */
:root{
  --void:#0a0b09;
  --metal-hi:#4a4d44; --metal-1:#2b2e27; --metal-2:#191b16; --metal-3:#0f100d;
  --rust:#8a4f22; --rust-2:#5a3216; --brass:#c9a35a;
  --hazard:#e0a526;
  --ph:#66ffa3; --ph-rgb:102,255,163;
  --screen:#03120a; --screen-2:#010804;
  --alert:#ff5b40; --alert-rgb:255,91,64;
  --warn:#ffc44d; --warn-rgb:255,196,77;
  --f-display:'VT323','Share Tech Mono',ui-monospace,monospace;
  --f-body:'Share Tech Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --f-plate:'Black Ops One',Impact,'Arial Black',sans-serif;
  color-scheme:dark;
}
:root[data-phos="amber"]{--ph:#ffb547;--ph-rgb:255,181,71;--screen:#140b02;--screen-2:#080400}
:root[data-phos="ice"]{--ph:#8fe6ff;--ph-rgb:143,230,255;--screen:#02101a;--screen-2:#00060b}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:#d8d6cc;font-family:var(--f-body);
  background:
    radial-gradient(120% 60% at 50% -10%, #3a3b33 0%, #16170f 45%, var(--void) 80%),
    var(--void);
  overflow:hidden;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

/* ───────────── the CRT ───────────── */
.screen{position:relative;height:100%;overflow:hidden;border-radius:19px / 22px;isolation:isolate;
  background:
    radial-gradient(120% 90% at 50% 45%, color-mix(in srgb, var(--screen) 70%, rgb(var(--ph-rgb)) 6%) 0%, var(--screen) 55%, var(--screen-2) 100%);
  color:var(--ph);
  text-shadow:0 0 1px rgba(var(--ph-rgb),.9), 0 0 6px rgba(var(--ph-rgb),.45), 0 0 16px rgba(var(--ph-rgb),.18);
  box-shadow: inset 0 0 50px rgba(0,0,0,.9), inset 0 0 6px rgba(0,0,0,.9);
}
/* flicker lives on an overlay's opacity: iOS Safari leaves ghost text behind when a filter animates over a scrolling area */
@keyframes flicker{0%,100%{opacity:1}41%{opacity:.82}42%{opacity:1}77%{opacity:1.12}78%{opacity:1}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:30;border-radius:inherit}
.fx.scan{background:repeating-linear-gradient(180deg, rgba(0,0,0,.24) 0 1px, transparent 1px 3px)}
.fx.mask{background:repeating-linear-gradient(90deg, rgba(255,0,0,.025) 0 1px, rgba(0,255,0,.02) 1px 2px, rgba(0,0,255,.025) 2px 3px)}
.fx.vig{background:radial-gradient(140% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 85%, rgba(0,0,0,.9) 100%)}
.fx.glare{background:
   radial-gradient(70% 35% at 22% 8%, rgba(255,255,255,.10), transparent 60%),
   linear-gradient(115deg, rgba(255,255,255,.06) 0%, transparent 28%, transparent 70%, rgba(255,255,255,.025) 100%)}
.fx.roll{background:linear-gradient(180deg, transparent, rgba(var(--ph-rgb),.06) 45%, rgba(var(--ph-rgb),.09) 50%, transparent);
  height:22%;inset:auto 0 auto 0;top:-25%;animation:roll 9s linear infinite}
@keyframes roll{to{top:110%}}
canvas.fx.noise{width:100%;height:100%;opacity:.035;image-rendering:pixelated}
.fx.vig{animation:flicker 7s infinite steps(1)}
.view svg text{text-shadow:none}
@media (prefers-reduced-motion:reduce){.screen,.lamp,.fx.roll,.fx.vig,.blink,.laser{animation:none!important}.fx.roll{display:none}}

.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;z-index:1;
  scrollbar-width:thin;scrollbar-color:rgba(var(--ph-rgb),.5) transparent;-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{width:6px}.view::-webkit-scrollbar-thumb{background:rgba(var(--ph-rgb),.4)}
.view > * + *{margin-top:14px}

/* ───────────── terminal typography ───────────── */
.h{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:.95;letter-spacing:.03em;margin:0;text-wrap:balance;
  text-shadow:0 0 1px rgba(var(--ph-rgb),1), 0 0 8px rgba(var(--ph-rgb),.6), 0 0 22px rgba(var(--ph-rgb),.25), -1px 0 rgba(255,60,60,.25), 1px 0 rgba(60,140,255,.25)}
.crumb{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.75}
.crumb span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb span:last-child{text-align:right;flex:none;max-width:45%}
.lbl{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.72}
.dim{opacity:.62}
.small{font-size:12px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.alert{color:var(--alert);text-shadow:0 0 6px rgba(var(--alert-rgb),.6)}
.warn{color:var(--warn);text-shadow:0 0 6px rgba(var(--warn-rgb),.5)}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
hr.rule{border:0;height:1px;background:repeating-linear-gradient(90deg, rgba(var(--ph-rgb),.6) 0 6px, transparent 6px 9px);margin:0}
p{margin:0;line-height:1.45;font-size:13px}

/* panels with bracket corners */
.panel{position:relative;padding:14px 12px 12px;border:1px solid rgba(var(--ph-rgb),.38);
  background:linear-gradient(180deg, rgba(var(--ph-rgb),.05), rgba(var(--ph-rgb),.015));
  box-shadow:inset 0 0 18px rgba(var(--ph-rgb),.05)}
.panel > .tab{position:absolute;top:-9px;left:10px;padding:0 6px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  background:var(--screen);line-height:18px}
.panel > .tab.r{left:auto;right:10px}
.panel::before,.panel::after{content:"";position:absolute;width:10px;height:10px;border:2px solid var(--ph);opacity:.9}
.panel::before{right:-2px;bottom:-2px;border-left:0;border-top:0}
.panel::after{left:-2px;bottom:-2px;border-right:0;border-top:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row > .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0;border-bottom:1px dotted rgba(var(--ph-rgb),.22)}
.kv:last-child{border-bottom:0}
.kv b{font-weight:400;font-family:var(--f-display);font-size:19px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}

/* buttons: phosphor outlines that invert when pressed */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 12px;
  border:1px solid var(--ph);background:rgba(var(--ph-rgb),.06);color:var(--ph);
  text-transform:uppercase;letter-spacing:.12em;font-size:12px;text-shadow:inherit;
  box-shadow:0 0 10px rgba(var(--ph-rgb),.15), inset 0 0 8px rgba(var(--ph-rgb),.08)}
.btn:hover{background:rgba(var(--ph-rgb),.14)}
.btn:active,.btn.on{background:var(--ph);color:var(--screen);text-shadow:none;box-shadow:0 0 18px rgba(var(--ph-rgb),.6)}
.btn.block{width:100%}
.btn.ghost{border-style:dashed;background:transparent}
.btn.danger{border-color:var(--alert);color:var(--alert);background:rgba(var(--alert-rgb),.07);text-shadow:0 0 6px rgba(var(--alert-rgb),.5)}
.btn.danger:active{background:var(--alert);color:#1a0500}
.btn.sm{min-height:32px;padding:4px 9px;font-size:11px}
.btn[disabled]{opacity:.4;pointer-events:none}
:focus-visible{outline:2px dashed var(--ph);outline-offset:2px}
.seg{display:flex;border:1px solid var(--ph)}
.seg button{flex:1;min-height:38px;border:0;background:transparent;color:var(--ph);letter-spacing:.12em;font-size:11.5px;text-transform:uppercase;text-shadow:inherit}
.seg button + button{border-left:1px solid rgba(var(--ph-rgb),.5)}
.seg button.on{background:var(--ph);color:var(--screen);text-shadow:none}

/* inputs: underscored terminal fields */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field > span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.in{width:100%;min-width:0;min-height:38px;padding:6px 8px;border:0;border-bottom:1px solid var(--ph);
  background:rgba(var(--ph-rgb),.06);color:var(--ph);font-size:16px;text-shadow:inherit;border-radius:0;outline:none}
.in:focus{background:rgba(var(--ph-rgb),.13);box-shadow:0 1px 0 var(--ph)}
.in::placeholder{color:rgba(var(--ph-rgb),.38)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ph) 50%),linear-gradient(135deg,var(--ph) 50%,transparent 50%);
  background-position:calc(100% - 14px) 55%, calc(100% - 9px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
select.in option{background:#06120b;color:#9fffc4}
textarea.in{min-height:90px;font-size:16px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer}
.check input{appearance:none;width:20px;height:20px;border:1px solid var(--ph);display:grid;place-items:center;flex:none;margin:0}
.check input:checked::after{content:"";width:10px;height:10px;background:var(--ph);box-shadow:0 0 8px var(--ph)}

/* segmented progress bars */
.bar{position:relative;height:14px;border:1px solid rgba(var(--ph-rgb),.55);padding:2px}
.bar > i{display:block;height:100%;width:var(--w,0%);max-width:100%;
  background:repeating-linear-gradient(90deg, var(--ph) 0 6px, transparent 6px 8px);
  box-shadow:0 0 8px rgba(var(--ph-rgb),.6);transition:width .5s}
.bar.over > i{background:repeating-linear-gradient(90deg, var(--alert) 0 6px, transparent 6px 8px);box-shadow:0 0 8px rgba(var(--alert-rgb),.6)}
.meter{display:flex;flex-direction:column;gap:5px}
.meter .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meter .top b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}

/* ───────────── STAT ───────────── */
.dial{display:grid;grid-template-columns:1fr;justify-items:center;position:relative}
.dial svg{width:100%;max-width:330px;height:auto;overflow:visible}
.dial .readout{margin-top:-6px;text-align:center;line-height:.8}
.dial .readout b{display:block;font-family:var(--f-display);font-weight:400;font-size:74px;letter-spacing:.02em;
  text-shadow:0 0 2px rgba(var(--ph-rgb),1), 0 0 14px rgba(var(--ph-rgb),.7), 0 0 40px rgba(var(--ph-rgb),.35)}
.dial .readout span{font-size:11px;letter-spacing:.3em}
.status-chip{display:inline-block;padding:3px 10px;border:1px solid currentColor;font-size:11px;letter-spacing:.25em}
.status-chip.fail{color:var(--alert);background:rgba(var(--alert-rgb),.1)}
.dir{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted rgba(var(--ph-rgb),.25);font-size:13px}
.dir:last-child{border-bottom:0}
.dir .box{width:16px;height:16px;border:1px solid var(--ph);display:grid;place-items:center}
.dir.ok .box::after{content:"";width:8px;height:8px;background:var(--ph);box-shadow:0 0 8px var(--ph)}
.dir.bad{color:var(--alert);text-shadow:0 0 6px rgba(var(--alert-rgb),.5)}
.dir.bad .box{border-color:var(--alert)}
.dir.bad .box::after{content:"×";line-height:1;font-size:16px;margin-top:-2px}
.dir b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.log{font-size:12px;line-height:1.55;max-height:220px;overflow:auto}
.log div{display:grid;grid-template-columns:44px 1fr auto;gap:8px}
.log .pts{font-family:var(--f-display);font-size:16px}
.log .neg{color:var(--alert);text-shadow:0 0 5px rgba(var(--alert-rgb),.5)}

/* ───────────── SCAN ───────────── */
.scanner{position:relative;aspect-ratio:4/3;max-width:100%;border:1px solid rgba(var(--ph-rgb),.5);overflow:hidden;
  background:
    repeating-linear-gradient(0deg, rgba(var(--ph-rgb),.05) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgba(var(--ph-rgb),.05) 0 1px, transparent 1px 22px),
    radial-gradient(circle at 50% 50%, rgba(var(--ph-rgb),.08), transparent 70%)}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.25) brightness(1.05)}
.scanner .tint{position:absolute;inset:0;background:rgb(var(--ph-rgb));mix-blend-mode:multiply;opacity:.85;pointer-events:none}
.scanner .reticle{position:absolute;inset:18% 12%;pointer-events:none}
.scanner .reticle i{position:absolute;width:26px;height:26px;border:2px solid var(--ph);box-shadow:0 0 10px var(--ph)}
.scanner .reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
.scanner .reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.scanner .reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
.scanner .reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.laser{position:absolute;left:8%;right:8%;height:2px;top:20%;background:var(--alert);
  box-shadow:0 0 8px 2px rgba(var(--alert-rgb),.8), 0 0 30px 6px rgba(var(--alert-rgb),.35);animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{to{top:78%}}
.scanner .idle{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;font-size:12px;letter-spacing:.14em}
.verdict{position:relative;padding:16px 14px;border:2px solid currentColor;text-align:center;overflow:hidden}
.verdict .big{font-family:var(--f-display);font-size:68px;line-height:.85;letter-spacing:.06em}
.verdict .sub{font-size:11px;letter-spacing:.24em;margin-top:6px}
.verdict.yes{color:var(--ph);background:rgba(var(--ph-rgb),.08)}
.verdict.no{color:var(--alert);background:rgba(var(--alert-rgb),.10);text-shadow:0 0 2px rgba(var(--alert-rgb),1),0 0 14px rgba(var(--alert-rgb),.6)}
.verdict.limit{color:var(--warn);background:rgba(var(--warn-rgb),.08);text-shadow:0 0 2px rgba(var(--warn-rgb),1),0 0 14px rgba(var(--warn-rgb),.5)}
.verdict.no::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg, rgba(var(--alert-rgb),.12) 0 10px, transparent 10px 20px)}
.reasons{list-style:none;margin:0;padding:0;font-size:12.5px;line-height:1.5}
.reasons li{display:grid;grid-template-columns:16px 1fr;gap:6px}
.reasons li.bad{color:var(--alert)}
.reasons li.mid{color:var(--warn)}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dotted rgba(var(--ph-rgb),.25);font-size:13px;width:100%;
  background:none;border-left:0;border-right:0;border-top:0;color:inherit;text-align:left;text-shadow:inherit}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{flex:none;font-size:10px;letter-spacing:.14em;padding:2px 6px;border:1px solid currentColor}
.tag.YES{color:var(--ph)} .tag.NO{color:var(--alert)} .tag.LIMIT{color:var(--warn)}
.macro4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.macro4 div{border:1px solid rgba(var(--ph-rgb),.3);padding:6px 2px}
.macro4 b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1}
.macro4 span{font-size:9.5px;letter-spacing:.14em;opacity:.7}

/* ───────────── TRAIN ───────────── */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.week button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border:1px solid rgba(var(--ph-rgb),.35);
  background:transparent;color:var(--ph);text-shadow:inherit;font-size:10px;letter-spacing:.08em}
.week button b{font-family:var(--f-display);font-weight:400;font-size:17px;line-height:1}
.week button.today{border-color:var(--ph);box-shadow:0 0 10px rgba(var(--ph-rgb),.35)}
.week button.sel{background:var(--ph);color:var(--screen);text-shadow:none}
.week button.done b::after{content:"✓";font-size:12px;margin-left:2px}
.ex{padding:10px 0;border-bottom:1px dotted rgba(var(--ph-rgb),.28)}
.ex:last-child{border-bottom:0}
.ex .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex .t h4{margin:0;font-weight:400;font-size:15px;letter-spacing:.04em}
.ex .t .sr{font-family:var(--f-display);font-size:20px;white-space:nowrap}
.ex .meta{font-size:11.5px;opacity:.7;margin-top:2px}
.ex.opt h4::after{content:" · OPTIONAL";font-size:10px;letter-spacing:.14em;opacity:.7}
.ex.stretch{opacity:.7}
.sets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sets button{width:40px;height:34px;border:1px solid var(--ph);background:transparent;color:var(--ph);text-shadow:inherit;font-family:var(--f-display);font-size:18px}
.sets button.on{background:var(--ph);color:var(--screen);text-shadow:none;box-shadow:0 0 10px rgba(var(--ph-rgb),.6)}
.restbar{position:sticky;bottom:-28px;margin-inline:-16px;margin-bottom:-28px;padding:10px 16px 14px;z-index:5;display:flex;align-items:center;gap:12px;
  background:linear-gradient(180deg, transparent, var(--screen) 30%);}
.restbar .num{font-size:40px;line-height:1}

/* ───────────── STEPS ───────────── */
.ring{position:relative;display:grid;place-items:center}
.ring svg{width:min(240px,70vw);height:auto}
.ring .c{position:absolute;text-align:center;line-height:.9}
.ring .c b{display:block;font-family:var(--f-display);font-weight:400;font-size:58px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ph);font-family:var(--f-body);font-size:9px;opacity:.75}

/* ───────────── FUEL ───────────── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 4px 4px 9px;border:1px solid rgba(var(--ph-rgb),.6);font-size:12px}
.chip button{border:0;background:transparent;color:inherit;width:24px;height:24px;font-size:15px;line-height:1}
.meal{border-top:1px dashed rgba(var(--ph-rgb),.35);padding-top:10px}
.meal:first-child{border-top:0;padding-top:0}
.meal .mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal .mh h4{margin:0;font-weight:400;font-family:var(--f-display);font-size:24px;letter-spacing:.04em}
.meal table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.meal td{padding:3px 0;border-bottom:1px dotted rgba(var(--ph-rgb),.18)}
.meal td.n{text-align:right;font-family:var(--f-display);font-size:17px;white-space:nowrap;padding-left:8px}
.warnbox{border:1px solid var(--warn);color:var(--warn);padding:10px;font-size:12.5px;line-height:1.45;text-shadow:0 0 5px rgba(var(--warn-rgb),.4)}
.warnbox + .warnbox{margin-top:6px}
.recipes{display:grid;grid-template-columns:1fr;gap:6px}

/* ───────────── MONTH ───────────── */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .hd{text-align:center;font-size:10px;letter-spacing:.14em;opacity:.6;padding-bottom:2px}
.cal button{position:relative;aspect-ratio:1/1.08;border:1px solid rgba(var(--ph-rgb),.28);background:transparent;color:var(--ph);text-shadow:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;min-width:0}
.cal button b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1}
.cal button span{font-size:8.5px;letter-spacing:.08em;opacity:.65}
.cal button.perfect{background:var(--ph);color:var(--screen);text-shadow:none;box-shadow:0 0 12px rgba(var(--ph-rgb),.55)}
.cal button.perfect span{opacity:.9}
.cal button.pass{border-color:var(--ph);background:rgba(var(--ph-rgb),.12)}
.cal button.fail{border-color:var(--alert);color:var(--alert);background:repeating-linear-gradient(-45deg, rgba(var(--alert-rgb),.16) 0 5px, transparent 5px 10px);text-shadow:0 0 6px rgba(var(--alert-rgb),.5)}
.cal button.today{outline:2px solid var(--ph);outline-offset:1px}
.cal button.future{opacity:.5}
.cal button.sel{box-shadow:inset 0 0 0 2px var(--warn)}
.cal .blank{border:0}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;letter-spacing:.08em}
.legend i{display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;border:1px solid var(--ph)}
.legend .p{background:var(--ph)} .legend .s{background:rgba(var(--ph-rgb),.2)} .legend .f{border-color:var(--alert);background:rgba(var(--alert-rgb),.4)}

/* boot overlay */

.boot .logo{font-family:var(--f-display);font-size:64px;line-height:.85;letter-spacing:.12em;margin:8px 0 10px;
  text-shadow:0 0 2px rgba(var(--ph-rgb),1), 0 0 18px rgba(var(--ph-rgb),.7), 0 0 50px rgba(var(--ph-rgb),.3)}

.toast{position:absolute;left:12px;right:12px;bottom:12px;z-index:25;padding:10px 12px;border:1px solid currentColor;background:var(--screen);font-size:12.5px;
  box-shadow:0 0 18px rgba(var(--ph-rgb),.3);transform:translateY(140%);transition:transform .25s}

.toast.bad{color:var(--alert);box-shadow:0 0 18px rgba(var(--alert-rgb),.35)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;list-style:none;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
details summary::before{content:"▸ "}
details[open] summary::before{content:"▾ "}

/* ───────────── the hardware ─────────────
   Light model: one warm key light up-left, cool fill from below-right.
   Every raised part: bright top chamfer, dark bottom chamfer, cast shadow down-right.
   Every recessed part: the inverse. Textures (steel, brushed alloy) are painted on a
   canvas at boot by hardware.js and handed in as --tex-* variables. */
body{
  background:
    radial-gradient(70% 55% at 30% 0%, rgba(255,226,180,.10), transparent 70%),
    radial-gradient(120% 80% at 50% 120%, #000 30%, transparent 70%),
    repeating-radial-gradient(circle at 20% 30%, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    #12130f;
}
.device{
  position:relative;height:100%;max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:12px 12px;
  background:
    radial-gradient(90% 45% at 22% -5%, rgba(255,232,190,.22), transparent 60%),
    radial-gradient(80% 40% at 100% 110%, rgba(140,170,200,.10), transparent 60%),
    linear-gradient(180deg, rgba(255,255,255,.05), rgba(0,0,0,.35)),
    var(--tex-steel, linear-gradient(#3a3c35,#1d1f1a)) center / cover,
    #2a2c26;
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.22), inset 0 -3px 2px rgba(0,0,0,.75),
    inset 2px 0 1px rgba(255,255,255,.08), inset -2px 0 2px rgba(0,0,0,.5),
    inset 0 0 0 1px rgba(0,0,0,.6);
}
@media (min-width:600px){
  body{padding-block:22px}
  .device{border-radius:34px;
    box-shadow:
      inset 0 2px 1px rgba(255,255,255,.22), inset 0 -3px 2px rgba(0,0,0,.75),
      inset 2px 0 1px rgba(255,255,255,.08), inset -2px 0 2px rgba(0,0,0,.5),
      0 0 0 1px #050504, 0 2px 0 2px #0c0d0a,
      14px 30px 50px rgba(0,0,0,.75), 30px 70px 90px rgba(0,0,0,.5)}
}

/* rubber corner bumpers with grip ribs */
.bumper{position:absolute;width:30px;height:30px;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 2px, transparent 2px 5px),
    radial-gradient(circle at 30% 25%, #3a3a36, #121210 70%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.15), inset 0 -2px 3px rgba(0,0,0,.8), 0 2px 4px rgba(0,0,0,.6)}
.bumper.tl{top:0;left:0;border-radius:0 0 18px 0}
.bumper.tr{top:0;right:0;border-radius:0 0 0 18px}
.bumper.bl{bottom:0;left:0;border-radius:0 18px 0 0}
.bumper.br{bottom:0;right:0;border-radius:18px 0 0 0}
@media (min-width:600px){.bumper.tl{border-radius:34px 0 18px 0}.bumper.tr{border-radius:0 34px 0 18px}.bumper.bl{border-radius:0 18px 0 34px}.bumper.br{border-radius:18px 0 34px 0}}

/* Phillips screws, countersunk */
.screw{position:absolute;width:12px;height:12px;border-radius:50%;z-index:2;
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,.75) 0 10%, transparent 34%),
    radial-gradient(circle at 50% 50%, #9d998b 0 45%, #5d5a50 70%, #2a2924 100%);
  box-shadow:0 0 0 1.5px rgba(0,0,0,.65), 0 0 0 3px rgba(255,255,255,.06), 1px 2px 2px rgba(0,0,0,.7)}
.screw::before,.screw::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:1.6px;background:#23221d;border-radius:1px;
  box-shadow:0 .6px 0 rgba(255,255,255,.35);transform:translate(-50%,-50%) rotate(var(--r,20deg))}
.screw::after{transform:translate(-50%,-50%) rotate(calc(var(--r,20deg) + 90deg))}

/* ── top deck ── */
.top{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:10px}
.nameplate{position:relative;display:flex;align-items:center;gap:11px;min-width:0;padding:9px 14px 9px 12px;border-radius:7px;
  background:
    linear-gradient(180deg, rgba(255,250,235,.35), rgba(255,255,255,0) 35%, rgba(0,0,0,.25)),
    var(--tex-alloy, linear-gradient(#a8a493,#77735f)) center / 220% 100%,
    #8f8b78;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.65), inset 0 -1px 0 rgba(0,0,0,.45),
    inset 1px 0 0 rgba(255,255,255,.25), inset -1px 0 0 rgba(0,0,0,.3),
    0 0 0 1px rgba(0,0,0,.55), 2px 4px 5px rgba(0,0,0,.6)}
.nameplate .screw{width:8px;height:8px}
.nameplate .screw::before,.nameplate .screw::after{width:5px;height:1.2px}
.nameplate .s1{left:4px;top:4px}.nameplate .s2{right:4px;top:4px;--r:60deg}.nameplate .s3{left:4px;bottom:4px;--r:-15deg}.nameplate .s4{right:4px;bottom:4px;--r:110deg}
.lampwell{flex:none;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;margin-left:6px;
  background:conic-gradient(from 30deg, #e9e5d8, #6d6a5e, #d7d2c3, #4d4a41, #e9e5d8);
  box-shadow:0 1px 2px rgba(0,0,0,.7), inset 0 0 0 1px rgba(0,0,0,.5)}
.lamp{width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 0 9%, var(--lamp, var(--ph)) 38%, color-mix(in srgb, var(--lamp, var(--ph)) 45%, #000) 100%);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.45), 0 0 10px 2px var(--lamp, var(--ph)), 0 0 26px 6px color-mix(in srgb, var(--lamp, var(--ph)) 35%, transparent);
  animation:lampPulse 2.6s ease-in-out infinite}
@keyframes lampPulse{50%{filter:brightness(.78)}}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0}
.brand b{font-family:var(--f-plate);font-weight:400;font-size:25px;letter-spacing:.1em;color:#2f2d25;
  text-shadow:0 1px 0 rgba(255,255,255,.55), 0 -1px 0 rgba(0,0,0,.35)}
.brand small{margin-top:4px;font-size:9px;letter-spacing:.24em;color:#26241c;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 0 rgba(255,255,255,.45)}
/* recessed LCD window */
.lcd{position:relative;padding:7px 9px 6px;border-radius:5px;font-family:var(--f-display);font-size:21px;line-height:1;white-space:nowrap;
  color:var(--warn);background:linear-gradient(180deg,#140d03,#1f1607);

  text-shadow:0 0 6px rgba(var(--warn-rgb),.75), 0 0 14px rgba(var(--warn-rgb),.3);font-variant-numeric:tabular-nums;overflow:hidden}
.lcd::before{content:"88|88:88";position:absolute;left:9px;top:7px;color:rgba(var(--warn-rgb),.07);text-shadow:none;letter-spacing:inherit}
.lcd::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg, rgba(255,255,255,.16), transparent 40%);pointer-events:none}
.lcd > span{position:relative}
/* knurled setup knob */
.knob{position:relative;flex:none;width:50px;height:50px;border:0;border-radius:50%;padding:0;
  background:repeating-conic-gradient(from 0deg, #8a877b 0 3deg, #2c2b26 3deg 6deg);
  box-shadow:0 0 0 1px rgba(0,0,0,.7), 3px 5px 6px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
  transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.knob::before{content:"";position:absolute;inset:5px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), transparent 35%),
    conic-gradient(from 210deg, #f0ede3, #77746a 20%, #d9d5c8 38%, #5b5950 55%, #e2ded2 72%, #6e6b61 88%, #f0ede3);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.6), inset 0 -2px 2px rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.6)}
.knob::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:9px;margin-left:-1.5px;border-radius:2px;background:#1c1b17;box-shadow:0 1px 0 rgba(255,255,255,.4)}
.knob svg{position:absolute;inset:0;margin:auto;width:17px;height:17px;fill:#3a382f;filter:drop-shadow(0 1px 0 rgba(255,255,255,.5))}
.knob:active{transform:rotate(25deg)}

/* ── CRT housing: outer chamfer, rubber gasket, screws ── */
.bezel{position:relative;z-index:1;flex:1;min-height:0;padding:15px;border-radius:30px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0) 6%, rgba(0,0,0,0) 92%, rgba(0,0,0,.45)),
    linear-gradient(90deg, rgba(255,255,255,.08), transparent 8%, transparent 92%, rgba(0,0,0,.3)),
    var(--tex-steel, #2a2c26) center / cover, #2b2d27;
  box-shadow:
    inset 0 2px 1px rgba(255,255,255,.3), inset 0 -2px 2px rgba(0,0,0,.7),
    0 0 0 1px rgba(0,0,0,.75), 3px 6px 10px rgba(0,0,0,.65), 0 -1px 0 rgba(255,255,255,.08)}
.bezel > .screw.a{left:6px;top:6px}.bezel > .screw.b{right:6px;top:6px;--r:70deg}.bezel > .screw.c{left:6px;bottom:6px;--r:-30deg}.bezel > .screw.d{right:6px;bottom:6px;--r:5deg}
.gasket{position:relative;height:100%;padding:5px;border-radius:24px / 27px;
  background:linear-gradient(180deg,#050505,#1a1a18 40%,#0a0a09);
  box-shadow:inset 0 3px 6px rgba(0,0,0,1), inset 0 -1px 0 rgba(255,255,255,.1), 0 1px 0 rgba(255,255,255,.12), 0 -1px 0 rgba(0,0,0,.8),
             0 0 34px rgba(var(--ph-rgb),.12)}
.engrave{position:absolute;z-index:3;left:50%;transform:translateX(-50%);bottom:1px;font-size:7.5px;letter-spacing:.32em;color:rgba(0,0,0,.65);
  text-shadow:0 1px 0 rgba(255,255,255,.18);white-space:nowrap;text-transform:uppercase;pointer-events:none}

/* ── lower deck: speaker grille + serial plate ── */
.deck{position:relative;z-index:1;display:flex;align-items:center;gap:10px;height:16px;padding-inline:6px}
.grille{flex:1;height:100%;border-radius:8px;
  background:radial-gradient(circle, #050505 0 1.6px, transparent 2px) 0 0 / 7px 7px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.serial{flex:none;padding:2px 7px;border-radius:2px;font-size:7.5px;letter-spacing:.2em;color:#2a281f;text-transform:uppercase;
  background:linear-gradient(180deg,#d8cfb0,#b5ab8a);box-shadow:0 1px 1px rgba(0,0,0,.6), inset 0 0 0 1px rgba(0,0,0,.2);transform:rotate(-1deg)}
.serial::after{content:"";display:inline-block;width:18px;height:6px;margin-left:6px;vertical-align:-1px;
  background:repeating-linear-gradient(90deg,#2a281f 0 1px,transparent 1px 2px,#2a281f 2px 4px,transparent 4px 5px)}

/* ── key tray + machined keys ── */
.keys{position:relative;z-index:1;display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:7px;border-radius:14px;
  background:linear-gradient(180deg,#0b0b09,#1a1b17);
  box-shadow:inset 0 3px 6px rgba(0,0,0,.95), inset 0 -1px 0 rgba(255,255,255,.08), 0 1px 0 rgba(255,255,255,.14)}
.key{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 7px;border:0;border-radius:9px;min-width:0;
  color:#2b2a24;font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  text-shadow:0 1px 0 rgba(255,255,255,.45);
  background:
    linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 30%, rgba(0,0,0,.18) 85%, rgba(0,0,0,.35)),
    var(--tex-alloy, linear-gradient(#9a968a,#6c695e)) center / 300% 100%, #8b877a;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.7), inset 0 -2px 0 rgba(0,0,0,.35), inset 1px 0 0 rgba(255,255,255,.2), inset -1px 0 0 rgba(0,0,0,.2),
    0 0 0 1px rgba(0,0,0,.7), 0 4px 0 #2c2b25, 0 4px 0 1px rgba(0,0,0,.7), 2px 7px 7px rgba(0,0,0,.7);
  transition:transform .06s, box-shadow .06s; margin-bottom:4px}
.key svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:square;filter:drop-shadow(0 1px 0 rgba(255,255,255,.45))}
.key::before{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #5b3a1c, #1d0f05);box-shadow:inset 0 1px 1px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.4)}
.key:active{transform:translateY(3px);box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(0,0,0,.35),
    0 0 0 1px rgba(0,0,0,.7), 0 1px 0 #2c2b25, 0 1px 0 1px rgba(0,0,0,.7), 1px 2px 3px rgba(0,0,0,.7)}
.key.on{transform:translateY(2px);color:var(--ph);
  text-shadow:0 0 4px rgba(var(--ph-rgb),.9), 0 0 12px rgba(var(--ph-rgb),.5);
  background:
    linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,0) 30%, rgba(0,0,0,.25)),
    var(--tex-alloy, #6c695e) center / 300% 100%, #77736a;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(0,0,0,.35), inset 0 0 14px rgba(0,0,0,.35),
    0 0 0 1px rgba(0,0,0,.7), 0 2px 0 #2c2b25, 0 2px 0 1px rgba(0,0,0,.7), 1px 4px 5px rgba(0,0,0,.7)}
.key.on svg{filter:drop-shadow(0 0 3px rgba(var(--ph-rgb),.9)) drop-shadow(0 0 8px rgba(var(--ph-rgb),.5))}
.key.on::before{background:radial-gradient(circle at 35% 30%, #fff 0 12%, var(--ph) 45%);box-shadow:0 0 6px 1px var(--ph), 0 0 14px 3px rgba(var(--ph-rgb),.45)}
.nameplate{overflow:hidden}
.brand b{white-space:nowrap}
@media (max-width:400px){
  .top{gap:7px}
  .nameplate{padding:8px 10px 8px 8px;gap:8px}
  .lampwell{margin-left:2px;width:21px;height:21px}.lamp{width:13px;height:13px}

<script>/* Paints the device's surfaces once at boot: weathered gunmetal for the casing,
   brushed alloy for the nameplate and keycaps. Seeded so the same scratches and
   rust land in the same places every launch. */
(function paintHardware(){
  try {
    let seed = 418;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };

    /* gunmetal casing */
    const [c, x] = mk(560, 1100), W = c.width, H = c.height;
    const base = x.createLinearGradient(0, 0, W*.3, H);
    base.addColorStop(0, '#4a4c45'); base.addColorStop(.45, '#33352f'); base.addColorStop(1, '#25271f');
    x.fillStyle = base; x.fillRect(0, 0, W, H);
    // directional brushing
    for (let i = 0; i < 5200; i++){
      const y = rnd()*H, len = 30 + rnd()*260, x0 = rnd()*W, light = rnd() > .5;
      x.strokeStyle = light ? `rgba(255,255,240,${.012 + rnd()*.035})` : `rgba(0,0,0,${.02 + rnd()*.05})`;
      x.lineWidth = rnd() < .9 ? 1 : 2; x.beginPath(); x.moveTo(x0, y); x.lineTo(x0 + len, y + gauss()*1.2); x.stroke();
    }
    // fine grain
    const img = x.getImageData(0, 0, W, H), d = img.data;
    for (let i = 0; i < d.length; i += 4){ const n = (rnd() - .5) * 16; d[i] += n; d[i+1] += n; d[i+2] += n*.9; }
    x.putImageData(img, 0, 0);
    // rust and grime blooms, clustered toward edges and screw corners
    const blooms = [[.02,.03,90],[.97,.05,70],[.03,.97,110],[.96,.93,95],[.5,.995,80],[.0,.5,60],[1,.62,55],[.8,.2,30],[.18,.72,26]];
    for (const [bx, by, r] of blooms){
      for (let i = 0; i < 900; i++){
        const px = bx*W + gauss()*r, py = by*H + gauss()*r, s = .6 + rnd()*3.2;
        const hue = rnd(); x.fillStyle = hue < .55 ? `rgba(122,62,22,${.05 + rnd()*.16})` : hue < .85 ? `rgba(78,40,16,${.06 + rnd()*.18})` : `rgba(170,98,40,${.04 + rnd()*.1})`;
        x.beginPath(); x.arc(px, py, s, 0, Math.PI*2); x.fill();
      }
      for (let i = 0; i < 70; i++){ // pitting
        x.fillStyle = `rgba(10,6,3,${.2 + rnd()*.4})`; x.beginPath(); x.arc(bx*W + gauss()*r*.8, by*H + gauss()*r*.8, .5 + rnd()*1.1, 0, Math.PI*2); x.fill();
      }
    }
    // oily grime vignette
    const v = x.createRadialGradient(W*.45, H*.4, H*.2, W*.5, H*.5, H*.75);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(8,6,2,.55)'); x.fillStyle = v; x.fillRect(0, 0, W, H);
    // scratches: bright bare-metal hairlines with a dark lip
    for (let i = 0; i < 170; i++){
      const sx = rnd()*W, sy = rnd()*H, len = 8 + rnd()*(rnd() < .15 ? 160 : 45), a = gauss()*1.4 + (rnd() < .5 ? .3 : -.6);
      const ex = sx + Math.cos(a)*len, ey = sy + Math.sin(a)*len, cx = (sx+ex)/2 + gauss()*6, cy = (sy+ey)/2 + gauss()*6;
      x.lineWidth = .7 + rnd()*.6;
      x.strokeStyle = `rgba(0,0,0,${.15 + rnd()*.2})`; x.beginPath(); x.moveTo(sx, sy+1); x.quadraticCurveTo(cx, cy+1, ex, ey+1); x.stroke();
      x.strokeStyle = `rgba(225,222,205,${.08 + rnd()*.22})`; x.beginPath(); x.moveTo(sx, sy); x.quadraticCurveTo(cx, cy, ex, ey); x.stroke();
    }
    // worn bare-metal edges
    x.strokeStyle = 'rgba(205,200,182,.18)'; x.lineWidth = 2;
    for (let i = 0; i < 60; i++){ const t = rnd(), side = rnd()*4|0, L = 10 + rnd()*60; x.beginPath();
      if (side === 0){ x.moveTo(t*W, 1); x.lineTo(t*W + L, 1); } else if (side === 1){ x.moveTo(W-1, t*H); x.lineTo(W-1, t*H + L); }
      else if (side === 2){ x.moveTo(t*W, H-1); x.lineTo(t*W + L, H-1); } else { x.moveTo(1, t*H); x.lineTo(1, t*H + L); } x.stroke(); }

    /* brushed alloy for plates and keycaps */
    const [a, y] = mk(420, 140);
    const ag = y.createLinearGradient(0, 0, a.width, 0);
    ag.addColorStop(0, '#a19d8d'); ag.addColorStop(.3, '#c4bfae'); ag.addColorStop(.55, '#8e8a7b'); ag.addColorStop(.8, '#b8b3a2'); ag.addColorStop(1, '#8a8676');
    y.fillStyle = ag; y.fillRect(0, 0, a.width, a.height);
    for (let i = 0; i < 2600; i++){ const yy = rnd()*a.height, xx = rnd()*a.width, l = 20 + rnd()*160;
      y.strokeStyle = rnd() > .5 ? `rgba(255,255,250,${.03 + rnd()*.08})` : `rgba(40,36,26,${.03 + rnd()*.08})`; y.lineWidth = 1;
      y.beginPath(); y.moveTo(xx, yy); y.lineTo(xx + l, yy); y.stroke(); }
    for (let i = 0; i < 260; i++){ y.fillStyle = `rgba(60,48,30,${rnd()*.12})`; y.fillRect(rnd()*a.width, rnd()*a.height, 1 + rnd()*2, 1); }
    for (let i = 0; i < 14; i++){ const sx = rnd()*a.width, sy = rnd()*a.height, l = 6 + rnd()*30, an = gauss();
      y.strokeStyle = `rgba(255,255,255,${.15 + rnd()*.2})`; y.lineWidth = .6; y.beginPath(); y.moveTo(sx, sy); y.lineTo(sx + Math.cos(an)*l, sy + Math.sin(an)*l); y.stroke(); }

    const root = document.documentElement.style;
    root.setProperty('--tex-steel', `url(${c.toDataURL('image/jpeg', .86)})`);
    root.setProperty('--tex-alloy', `url(${a.toDataURL('image/jpeg', .9)})`);
  } catch(e){ /* flat fallbacks in CSS */ }
})();

/* ───── targets (FORMA 02 · 01.04 → 02.03) ───── */
function targets(){
  const p = P(), L = lv(), W = +p.weightKg, H = +p.heightCm, A = +p.age;
  const bf = parseFloat(p.bf);
  const bmr = bf > 3 && bf < 60 ? 370 + 21.6 * W * (1 - bf/100) : 10*W + 6.25*H - 5*A + (p.sex === 'f' ? -161 : 5);
  const tdee = bmr * (+p.activity || 1.55);
  const kcal = Math.round(Math.max(tdee * (1 - L.deficit), bmr) / 10) * 10;
  const prot = Math.round(W * L.prot);
  const fat = Math.round(kcal * L.fat / 9);
  const carbs = Math.max(0, Math.round((kcal - prot*4 - fat*9) / 4));
  return { bmr:r0(bmr), tdee:r0(tdee), kcal, p:prot, f:fat, c:carbs, fib:Math.round(kcal/1000*14), steps:L.steps,
           method: bf > 3 && bf < 60 ? 'Katch–McArdle' : 'Mifflin–St Jeor' };
}

/* ───── food verdicts ─────
   YES   = fits the plan
   LIMIT = allowed in a measured portion / within the daily allowance
   NO    = off-plan. Logging it costs points, more each time. */
function judge(f, levelKey){
  const lvK = levelKey || P().level, X = lvK === 'xlean', V = lvK === 'vlean';
  const kcal = +f.kcal || 0, p = +f.p || 0, sug = +f.sug || 0, sat = +f.sat || 0, fat = +f.f || 0, c = +f.c || 0, fib = +f.fib || 0;
  const pr = kcal > 0 ? (p*4) / kcal : 0;
  const out = []; let v = 0; // 0 YES, 1 LIMIT, 2 NO
  const hit = (lvl, msg) => { v = Math.max(v, lvl); out.push([lvl, msg]); };
  const isFruit = f.tag === 'fruit' || (fib >= 1.5 && fat < 1 && kcal < 100 && p < 3);
  const fatSource = fat >= 40 && sug < 12 && !f.drink;
  const staple = c >= 60 && sug <= 6 && fat <= 8;
  let cap = 0;

  if ((f.alc||0) > .5 || f.tag === 'alcohol') hit(X||V ? 2 : 1, 'Alcohol: 7 kcal/g with no nutritional role');
  if (f.drink && sug > 2.5) hit(2, `Liquid sugar: ${sug} g/100 ml`);
  if (f.tag === 'junk') hit(X||V ? 2 : 1, 'Fast food / confectionery: dense, low satiety');
  if (f.fried && f.tag !== 'junk') hit(X||V ? 2 : 1, 'Deep-fried: hidden oil calories');

  if (!isFruit && !f.drink){
    const [lim, no] = X ? [5, 5] : V ? [8, 12] : [15, 25];
    if (sug > no) hit(2, `Sugar ${sug} g/100 g (limit ${no} g)`);
    else if (sug > lim) hit(1, `Sugar ${sug} g/100 g is high`);
  }
  if (fatSource){
    cap = lv().fatCap; hit(1, `Fat source: measured portion only (max ${cap} g)`);
    if (sug > 15) hit(2, 'Sweetened fat source');
  } else if (kcal >= 400 && pr < .2 && !staple){
    hit(X||V ? 2 : 1, `Energy-dense: ${r0(kcal)} kcal/100 g with little protein`);
  } else if (kcal >= 250 && pr < .15 && (fat > 15 || sug > 10)){
    hit(X ? 2 : 1, `${r0(kcal)} kcal/100 g, mostly fat and sugar`);
  }
  if (sat > 10 && !fatSource) hit(X ? 2 : pr >= .25 ? 1 : (V ? 2 : 1), `Saturated fat ${sat} g/100 g`);
  if (f.nova === 4){
    if (X && !(pr >= .35 && sug <= 5)) hit(2, 'Ultra-processed (NOVA 4)');
    else if (V && pr < .2) hit(1, 'Ultra-processed (NOVA 4)');
    else out.push([0, 'Processed product, check the label']);
  }
  if (X && v === 1 && !fatSource) { v = 2; out.push([2, 'Extremely lean allows no "limit" foods']); }

  if (v < 2){
    if (pr >= .4) out.push([0, `Protein-dense: ${r0(pr*100)}% of calories from protein`]);
    if (kcal > 0 && kcal <= 60 && !f.drink) out.push([0, 'High-volume, low-calorie food']);
    if (fib >= 5) out.push([0, `Fibre ${fib} g/100 g keeps you full`]);
    if (staple) out.push([0, 'Staple carb: weigh the portion']);
    if (isFruit && !out.length) out.push([0, 'Whole fruit fits the plan']);
    if (!out.length) out.push([0, 'Within FORMA limits']);
  }
  return { v:['YES','LIMIT','NO'][v], reasons:out, cap };
}

/* ───── score engine ───── */
function addEvent(d, label, pts, extra){ const r = dayRec(d); r.events.push(Object.assign({ t:nowHM(), label, pts }, extra||{})); }
const eventPts = r => r.events.reduce((a,e) => a + (e.pts||0), 0);
function intake(r){ return r.foods.reduce((a,f) => ({ kcal:a.kcal+f.kcal, p:a.p+f.p, c:a.c+f.c, f:a.f+f.f }), {kcal:0,p:0,c:0,f:0}); }
function endPenalties(d, r){
  const L = lv(), t = targets(), m = L.mult, out = [];
  if (r.steps < L.steps) out.push([`Steps ${fmt(r.steps)} / ${fmt(L.steps)}`, Math.max(1, Math.round((1 - r.steps/L.steps) * 40 * m))]);
  const s = sessionFor(d);
  if (['chest','arms','back','legs'].includes(s) && !r.workoutDone) out.push([`Skipped ${SESSIONS[s].name}`, Math.round(30*m)]);
  if (s === 'cardio' && !r.cardioDone) out.push(['Skipped cardio', Math.round(30*m)]);
  const it = intake(r);
  if (it.kcal > t.kcal * 1.03) out.push([`Calories ${fmt(it.kcal)} / ${fmt(t.kcal)}`, Math.round(Math.ceil((it.kcal/t.kcal - 1) / .1) * 10 * m)]);
  const pr = it.p / t.p;
  if (pr < .7) out.push([`Protein ${r0(it.p)} / ${t.p} g`, Math.round(20*m)]);
  else if (pr < .9) out.push([`Protein ${r0(it.p)} / ${t.p} g`, Math.round(10*m)]);
  return out;
}
const liveScore = d => { const r = peekDay(d); return r ? clamp(100 - eventPts(r), 0, 100) : 100; };
function projScore(d){ const r = dayRec(d); return clamp(100 - eventPts(r) - endPenalties(d, r).reduce((a,x)=>a+x[1],0), 0, 100); }
function finalizePast(){
  const t = today(); let d = S.created, changed = false, guard = 0;
  while (d < t && guard++ < 800){
    const r = dayRec(d);
    if (r.final == null){ const ends = endPenalties(d, r); r.ends = ends; r.final = clamp(100 - eventPts(r) - ends.reduce((a,x)=>a+x[1],0), 0, 100); r.level = P().level; changed = true; }
    d = addDays(d, 1);
  }
  if (changed) save(true);
}

function logFood(f, grams, verdict, source){
  const d = today(), r = dayRec(d), L = lv(), k = grams/100;
  const id = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const entry = { id, name:f.name, grams, kcal:f.kcal*k, p:f.p*k, c:f.c*k, f:f.f*k, v:verdict.v, t:nowHM(), src:source||'' };
  r.foods.push(entry);
  if (verdict.v === 'NO'){
    const n = r.events.filter(e => e.kind === 'no').length + 1;
    addEvent(d, `Off-plan: ${f.name}${n>1?` (×${n})`:''}`, Math.round(12 * n * L.mult), { kind:'no', food:id });
    sfx('no');
  } else if (verdict.v === 'LIMIT'){
    const used = r.foods.filter(x => x.v === 'LIMIT' && !x.capped).length;
    const overCap = verdict.cap && grams > verdict.cap;
    if (verdict.cap) entry.capped = true;
    if (overCap || (!verdict.cap && used > L.limitFree)) addEvent(d, overCap ? `Over portion: ${f.name} ${grams} g > ${verdict.cap} g` : `Limit allowance used up: ${f.name}`, Math.round(5 * L.mult), { kind:'limit', food:id });
    sfx('ok');
  } else sfx('ok');
  save();
}

function gauge(v){
  const cx = 160, cy = 160, R = 132;
  const pt = (a, r) => [cx + r*Math.cos(a), cy + r*Math.sin(a)];
  const ang = s => Math.PI + (s/100) * Math.PI;
  let ticks = '';
  for (let s = 0; s <= 100; s += 2.5){ const major = s % 25 === 0, mid = s % 5 === 0;
    const [x1,y1] = pt(ang(s), R), [x2,y2] = pt(ang(s), R - (major?18:mid?11:6));
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="currentColor" stroke-width="${major?2.4:1.2}" opacity="${major?1:.7}"/>`;

}

/* pantry solver: projected Adam on grams (in 100 g units) */
function capFor(f){
  if (f.cap) return f.cap;
  const t = f.tag;
  if (t === 'fat') return f.f > 90 ? 25 : lv().fatCap * 2.5;
  if (t === 'dairy') return f.kcal > 150 ? 120 : 1200;
  if (t === 'egg') return f.id === 'eggwhite' ? 800 : 300;
  if (t === 'protein') return f.kcal > 300 ? 90 : 700;
  if (t === 'legume') return 700;
  if (t === 'veg') return 600;
  if (t === 'fruit') return 450;
  if (t === 'staple') return 140;
  if (t === 'carb') return f.kcal > 200 ? 200 : 600;
  if (['junk','drink','alcohol'].includes(t)) return 0;
  return f.kcal > 300 ? 100 : 500;
}
function tagOf(f){
  if (f.tag && f.tag !== 'other') return f.tag;
  const pr = f.kcal ? f.p*4/f.kcal : 0;
  if (pr >= .35) return 'protein'; if (f.f >= 40) return 'fat'; if (f.kcal <= 60) return 'veg'; if (f.c >= 60) return 'staple'; if (f.c*4/Math.max(1,f.kcal) > .6) return 'carb'; return 'other';
}
function buildPlan(){
  const t = targets(), all = S.pantry.map(foodById).filter(Boolean);
  const warn = [];
  const banned = all.filter(f => judge(f).v === 'NO');
  if (banned.length) warn.push(`Left out (NO at ${lv().name}): ${banned.map(f=>f.name).join(', ')}.`);
  const foods = all.filter(f => judge(f).v !== 'NO' && capFor(f) > 0);
  if (!foods.length){ toast('Add at least one allowed food to your pantry.', true); return null; }
  const n = foods.length, cap = foods.map(f => capFor(f)/100);
  const veg = foods.map(f => tagOf(f) === 'veg' || tagOf(f) === 'fruit');
  const hasVeg = veg.some(Boolean);
  const fatMin = t.kcal*.20/9, fatMax = t.kcal*.35/9;
  let x = foods.map((f,i) => Math.min(cap[i], .8));
  const m1 = new Array(n).fill(0), m2 = new Array(n).fill(0), lr = .03, b1 = .9, b2 = .999;
  for (let it = 1; it <= 5000; it++){
    let Pt = 0, K = 0, F = 0, V = 0;
    for (let i = 0; i < n; i++){ Pt += foods[i].p*x[i]; K += foods[i].kcal*x[i]; F += foods[i].f*x[i]; if (veg[i]) V += x[i]; }
    const eP = (Pt - t.p)/t.p, dP = (eP < 0 ? 24 : 1.5) * eP / t.p;
    const eK = (K - t.kcal)/t.kcal, dK = (eK > 0 ? 20 : 6) * eK / t.kcal;
    const dF = F < fatMin ? 4*(F - fatMin)/fatMin/fatMin : F > fatMax ? 4*(F - fatMax)/fatMax/fatMax : 0;
    const dV = hasVeg && V < 4 ? .25*(V - 4)/16 : 0;
    for (let i = 0; i < n; i++){
      const g = foods[i].p*dP + foods[i].kcal*dK + foods[i].f*dF + (veg[i] ? dV : 0) + .004*x[i];
      m1[i] = b1*m1[i] + (1-b1)*g; m2[i] = b2*m2[i] + (1-b2)*g*g;
      const mh = m1[i]/(1-Math.pow(b1,it)), vh = m2[i]/(1-Math.pow(b2,it));
      x[i] = clamp(x[i] - lr*mh/(Math.sqrt(vh)+1e-8), 0, cap[i]);
    }
  }
  const grams = x.map((v,i) => { const g = v*100; const step = tagOf(foods[i]) === 'fat' ? 5 : 10; return Math.round(g/step)*step; });
  const meals = MEALS.map(m => ({ name:m.name, time:m.time, k:m.k, items:[], kcal:0, p:0 }));
  foods.forEach((f,i) => {
    if (grams[i] <= 0) return;
    const w = SPLIT[tagOf(f)] || SPLIT.other; let left = grams[i];
    const parts = w.map(s => Math.round(grams[i]*s/5)*5);
    const fix = grams[i] - parts.reduce((a,b)=>a+b,0); const big = parts.indexOf(Math.max(...parts)); parts[big] += fix;
    parts.forEach((g, mi) => { if (g >= 5){ meals[mi].items.push({ id:f.id, name:f.name, g }); meals[mi].kcal += f.kcal*g/100; meals[mi].p += f.p*g/100; } });
  });
  const tot = foods.reduce((a,f,i) => ({ kcal:a.kcal+f.kcal*grams[i]/100, p:a.p+f.p*grams[i]/100, c:a.c+f.c*grams[i]/100, f:a.f+f.f*grams[i]/100 }), {kcal:0,p:0,c:0,f:0});
  if (tot.p < t.p*.92) warn.push(`Your pantry tops out at ${r0(tot.p)} g protein inside ${fmt(t.kcal)} kcal. Add a lean protein (chicken breast, egg whites, 0% Greek yogurt, tuna, whey) to reach ${t.p} g.`);
  if (tot.kcal > t.kcal*1.05) warn.push(`This runs ${fmt(tot.kcal - t.kcal)} kcal over target. Swap a dense food for a leaner one.`);
  if (tot.kcal < t.kcal*.85) warn.push(`Only ${fmt(tot.kcal)} kcal. Add a carb source (rice, potatoes, oats) so you can train hard.`);
  if (tot.f < fatMin*.9) warn.push(`Fat is ${r0(tot.f)} g, under the 20% floor (${r0(fatMin)} g). Add olive oil, eggs, avocado or nuts.`);
  if (!hasVeg) warn.push('No vegetables or fruit. FORMA builds lunch and dinner on protein + plants: add spinach, broccoli, peppers or berries.');
  const heavy = foods.map((f,i)=>[f,grams[i]]).filter(([f,g]) => g >= 600);
  if (heavy.length) warn.push(`Large volumes: ${heavy.map(([f,g])=>`${f.name} ${g} g`).join(', ')}. Spread them across the day or add variety.`);
  return { date:today(), meals, tot, warn };
}

/* ── MONTH ── */
function vMonth(){
  const now = new Date(), base = new Date(now.getFullYear(), now.getMonth() + ui.monthOff, 1);
  const Y = base.getFullYear(), M = base.getMonth(), days = new Date(Y, M+1, 0).getDate(), lead = (base.getDay()+6)%7, t = today();
  let perfect = 0, pass = 0, fail = 0, elapsed = 0, streak = 0, best = 0, run = 0;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="blank"></div>');
  for (let dd = 1; dd <= days; dd++){
    const d = `${Y}-${pad(M+1)}-${pad(dd)}`, sc = d < S.created ? null : dayScore(d), future = d > t;
    let cls = future ? 'future' : '';
    if (sc != null && d < t){ elapsed++; if (sc >= 100){ perfect++; cls = 'perfect'; run++; best = Math.max(best, run); } else if (sc > 0){ pass++; cls = 'pass'; run = 0; } else { fail++; cls = 'fail'; run = 0; } }
    if (d === t){ cls += ' today'; }
    if (ui.monthSel === d) cls += ' sel';
    cells.push(`<button class="${cls}" data-mday="${d}" aria-label="${d}${sc!=null?' score '+sc:''}"><b>${dd}</b><span>${d===t?liveScore(d):sc!=null&&d<t?sc:SESSION_ABBR[sessionFor(d)]}</span></button>`);
  }
  // streak counting back from yesterday (across months)
  let d = addDays(t,-1); while (d >= S.created){ const s = dayScore(d); if (s >= 100){ streak++; d = addDays(d,-1); } else break; }
  const sel = ui.monthSel && peekDay(ui.monthSel);
  const goalDays = days;
  return `<div class="crumb"><span>MONTH // OBJECTIVE</span><span>${perfect} / ${goalDays} PERFECT</span></div>
  <div class="row"><button class="btn sm" data-mon="-1" aria-label="Previous month">◂</button><h2 class="h grow" style="text-align:center">${MONTHS[M]} ${Y}</h2><button class="btn sm" data-mon="1" aria-label="Next month" ${ui.monthOff>=0?'disabled':''}>▸</button></div>
  <div class="bigstat"><div><b>${perfect}</b><span>PERFECT</span></div><div><b>${streak}</b><span>STREAK</span></div><div><b class="${fail?'alert':''}">${fail}</b><span>FAILED</span></div></div>
  ${meter('Monthly objective: every day perfect', perfect, goalDays)}
  <p class="small dim">${elapsed ? (perfect===elapsed ? 'Flawless so far. Keep the chain unbroken.' : `${elapsed-perfect} day${elapsed-perfect>1?'s':''} already short of perfect this month. Best run: ${best}.`) : 'A perfect day ends at 100. Every slip costs points, and 0 fails the day.'}</p>
  <div class="cal">${DOW.map(x=>`<div class="hd">${x.slice(0,2)}</div>`).join('')}${cells.join('')}</div>
  <div class="legend"><span><i class="p"></i>Perfect 100</span><span><i class="s"></i>Passed</span><span><i class="f"></i>Failed 0</span><span class="dim">CH AR BK LG CD RS = plan</span></div>
  ${ui.monthSel ? `<div class="panel"><span class="tab">${ui.monthSel}</span>${sel ? `
    <div class="kv"><span>Score</span><b>${dayScore(ui.monthSel) ?? '—'}</b></div><div class="kv"><span>Session</span><b>${SESSIONS[sessionFor(ui.monthSel)].name}</b></div><div class="kv"><span>Steps</span><b>${fmt(sel.steps)}</b></div><div class="kv"><span>Foods logged</span><b>${sel.foods.length}</b></div>
    <div class="log" style="margin-top:8px">${[...sel.events.map(e=>[e.t,e.label,e.pts]), ...((sel.ends||[]).map(e=>['23:59',e[0],e[1]]))].map(e=>`<div><span class="dim">${esc(e[0])}</span><span>${esc(e[1])}</span><span class="pts neg">−${e[2]}</span></div>`).join('') || '<div><span></span><span>No penalties</span><span></span></div>'}</div>`
    : `<p class="small">Planned: ${SESSIONS[sessionFor(ui.monthSel)].name}. ${ui.monthSel > t ? 'Not reached yet.' : 'No record for this day.'}</p>`}</div>` : ''}`;
}

/* ════════════════ RENDER + EVENTS ════════════════ */
function render(){
  if (cur !== 'scan' && camOn){ camOn = false; stopCam(); }
  const v = $('#view'), keepScroll = v.dataset.view === cur ? v.scrollTop : 0;
  const fn = { stat:vStat, scan:vScan, train:vTrain, steps:vSteps, fuel:vFuel, month:vMonth, setup:vSetup }[cur];
  v.innerHTML = fn(); v.dataset.view = cur; v.scrollTop = keepScroll;
  document.querySelectorAll('.key').forEach(k => k.classList.toggle('on', k.dataset.go === cur));
  const s = liveScore(today());
  document.documentElement.style.setProperty('--lamp', s >= 80 ? 'var(--ph)' : s > 30 ? 'var(--warn)' : 'var(--alert)');
  $('#lcdScore').textContent = String(s).padStart(3,'0');
  if (cur === 'scan' && camOn) attachCam();
  if (cur === 'scan'){ const si = $('#searchIn'); if (si && ui.focusSearch){ si.focus(); si.setSelectionRange(si.value.length, si.value.length); } }
}
function go(view){ if (!VIEWS.includes(view)) return; cur = view; if (location.hash.slice(1) !== view) history.replaceState(null, '', '#'+view); $('#view').scrollTop = 0; sfx('tick'); render(); }
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (VIEWS.includes(h) && h !== cur){ cur = h; render(); } });

const num = id => { const el = $('#'+id); return el && el.value !== '' ? parseFloat(el.value) : null; };
document.addEventListener('click', e => {
  const b = e.target.closest('button,[data-go]'); if (!b) return;
  const ds = b.dataset;
  if (ds.go) return go(ds.go);
  if (ds.smode){ if (camOn){ camOn = false; stopCam(); } ui.scanMode = ds.smode; sfx('tick'); return render(); }
  if (ds.ailog){ aiLog(+ds.ailog); toast(`Logged. Score ${liveScore(today())}.`, judge(ui.ai.items[+ds.ailog]).v === 'NO'); return render(); }
  if (ds.pick){ const f = foodById(ds.pick); if (f) showResult(Object.assign({ src:'FORMA DB' }, f)); return; }
  if (ds.online){ showResult(ui.online[+ds.online]); return; }
  if (ds.recent){ showResult(S.scans[+ds.recent]); return; }
  if (ds.tday){ ui.trainDay = ds.tday; sfx('tick'); return render(); }
  if (ds.mode){ P().mode = ds.mode; save(); sfx('tick'); return render(); }
  if (ds.set){ return tapSet(+ds.set, +ds.n); }
  if (ds.add){ const r = dayRec(today()); r.steps += +ds.add; save(); sfx('tick'); return render(); }
  if (ds.unlog){ unlogFood(ds.unlog); return render(); }
  if (ds.unpantry){ S.pantry = S.pantry.filter(x => x !== ds.unpantry); save(); return render(); }
  if (ds.recipe){ const x = RECIPES.find(r => r.id === ds.recipe); logFood({ name:x.name, kcal:x.kcal*100, p:x.p*100, c:x.c*100, f:x.f*100 }, 1, { v:'YES' }, 'recipe'); toast(`Logged ${x.name}.`); return render(); }
  if (ds.logmeal){ const m = S.plan.meals[+ds.logmeal]; m.items.forEach(it => { const f = foodById(it.id); if (f) logFood(f, it.g, judge(f), 'plan'); }); m.logged = true; save(); toast(`${m.name} logged.`); return render(); }
  if (ds.mday){ ui.monthSel = ui.monthSel === ds.mday ? null : ds.mday; return render(); }
  if (ds.mon){ ui.monthOff += +ds.mon; ui.monthSel = null; return render(); }
  if (ds.units){ readSetup(); P().units = ds.units; save(); return render(); }
  if (ds.level){ readSetup(); P().level = ds.level; save(); sfx('tick'); return render(); }
  if (ds.phos){ P().phos = ds.phos; document.documentElement.dataset.phos = ds.phos; save(); return render(); }
  if (ds.act) return act(ds.act, b);
});
document.addEventListener('input', e => {
  if (e.target.id === 'searchIn'){ ui.search = e.target.value; ui.online = null; ui.focusSearch = true; render(); ui.focusSearch = false; }
});
document.addEventListener('change', e => { if (e.target.id === 'photoIn') scanPhoto(e.target.files[0]); if (e.target.id === 'foodIn'){ analyzeFood(e.target.files[0]); e.target.value = ''; } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'codeIn') act('lookup'); else if (id === 'pantryIn') act('pantryAdd'); else if (id === 'searchIn' && ui.search.length >= 3) onlineSearch();
});

function tapSet(i, n){
  const d = today(), r = dayRec(d); r.sets = r.sets || {};
  const was = r.sets[i] || 0; r.sets[i] = was >= n ? n - 1 : n;
  const items = sessionItems(sessionFor(d)), e = items[i];
  if (r.sets[i] > was && e && e.rest && r.sets[i] < e.s){ startRest(e.rest, e.n); }
  const req = items.map((x,k)=>[x,k]).filter(([x]) => x.s && !x.opt);
  const allDone = req.every(([x,k]) => (r.sets[k]||0) >= x.s);
  if (allDone && !r.workoutDone){ completeWorkout(); return; }
  sfx('tick'); save(); render();
}
function completeWorkout(){ const d = today(), r = dayRec(d), k = sessionFor(d); r.workoutDone = true; ui.restEnd = 0; addEvent(d, `${SESSIONS[k].name} complete`, 0); sfx('done'); buzz([60,40,60,40,120]); save(true); toast('Session logged. Directive cleared.'); render(); }
let restTimer = 0;
function startRest(sec, label){
  ui.restEnd = Date.now() + sec*1000; ui.restLabel = label; clearInterval(restTimer);
  restTimer = setInterval(() => { const el = $('#restNum'); const left = Math.max(0, Math.round((ui.restEnd - Date.now())/1000));
    if (el) el.textContent = `${pad(Math.floor(left/60))}:${pad(left%60)}`;
    if (left <= 0){ clearInterval(restTimer); ui.restEnd = 0; sfx('done'); buzz([200,100,200]); if (cur === 'train') render(); } }, 250);
}
function readSetup(){
  const p = P(); if (!$('#s_w')) return;
  const w = num('s_w'); if (w) p.weightKg = imp() ? w/2.20462 : w;
  if (imp()){ const ft = num('s_ft'), inch = num('s_in') || 0; if (ft) p.heightCm = (ft*12 + inch)*2.54; } else { const h = num('s_h'); if (h) p.heightCm = h; }
  const a = num('s_age'); if (a) p.age = a;
  p.sex = $('#s_sex').value; p.bf = $('#s_bf').value; p.activity = +$('#s_act').value;
  p.noBar = $('#s_nobar').checked; p.widthAddon = $('#s_width').checked; p.sound = $('#s_sound').checked;
  const st = $('#s_start').value; if (st) p.start = mondayOf(st);
  const key = $('#s_key'); if (key) p.apiKey = key.value.trim();
}
function act(a, b){
  const d = today(), r = dayRec(d);
  switch(a){
    case 'weigh': { const w = num('wIn'); if (!w) return toast('Enter your weight first.', true); r.weight = imp() ? w/2.20462 : w; P().weightKg = r.weight; save(); toast('Weigh-in logged.'); return render(); }
    case 'offplan': { ui.search = ''; go('scan'); setTimeout(()=>{ const si = $('#searchIn'); si && si.focus(); }, 50); return toast('Search what you ate, then tap ATE IT ANYWAY.'); }
    case 'cam': if (camOn){ camOn = false; return stopCam(); } return startCam();
    case 'snap': return snapFood();
    case 'aiLogAll': ui.ai.items.forEach((f,i) => aiLog(i)); toast(`Plate logged. Score ${liveScore(today())}.`); return render();
    case 'lookup': return lookup($('#codeIn').value);
    case 'online': return onlineSearch();
    case 'label': {
      const f = { id:'lbl:'+Date.now(), name:($('#lb_name').value||'Label entry').trim(), src:'YOUR LABEL', tag:'other', drink:$('#lb_drink').checked };
      ['kcal','p','c','sug','f','sat','fib','alc'].forEach(k => f[k] = num('lb_'+k) || 0);
      if (!f.kcal && (f.p || f.c || f.f)) f.kcal = r0(f.p*4 + f.c*4 + f.f*9);
      if (!f.kcal && !f.p && !f.c && !f.f && !f.drink) return toast('Enter at least calories or macros.', true);
      ui.labelOpen = false; return showResult(f);
    }
    case 'logres': { const f = ui.scanRes, g = num('gramIn') || 100; const j = judge(f); logFood(f, g, j, 'scan');
      toast(j.v === 'NO' ? `Logged. Score now ${liveScore(d)}.` : `Logged ${g} g ${f.name}.`, j.v === 'NO'); return render(); }
    case 'pantryres': { const f = ui.scanRes; if (!foodById(f.id) || f.id.startsWith('off:') || f.id.startsWith('lbl:')){ if (!S.custom.find(x=>x.id===f.id)) S.custom.push(Object.assign({}, f, { tag:tagOf(f) })); }
      if (!S.pantry.includes(f.id)) S.pantry.push(f.id); save(); toast('Added to pantry.'); return render(); }
    case 'cardioDone': { r.cardioDone = true; r.cardioMin = num('cardioMin') || 40; addEvent(d, `Cardio ${r.cardioMin} min complete`, 0); sfx('done'); buzz([60,40,120]); save(true); toast('Cardio logged.'); return render(); }
    case 'workoutDone': return completeWorkout();
    case 'skipRest': ui.restEnd = 0; clearInterval(restTimer); return render();
    case 'ped': return togglePed();
    case 'stepSet': { const v = num('stepSet'); if (v == null) return; r.steps = Math.max(0, Math.round(v)); save(); toast('Steps updated.'); return render(); }
    case 'pantryAdd': { const q = ($('#pantryIn').value || '').trim().toLowerCase(); if (!q) return;
      const f = allFoods().find(x => x.name.toLowerCase() === q) || allFoods().find(x => (x.name + ' ' + (x.alias||'')).toLowerCase().includes(q));
      if (!f) return toast('Not in the database. Use "Food not listed?" below.', true);
      if (!S.pantry.includes(f.id)) S.pantry.push(f.id); save(); return render(); }
    case 'customAdd': { const name = ($('#cf_name').value||'').trim(); if (!name) return toast('Name the food.', true);
      const f = { id:'c'+Date.now().toString(36), name, src:'MY FOOD' }; ['kcal','p','c','f','sug','fib'].forEach(k => f[k] = num('cf_'+k) || 0); f.sat = 0;
      if (!f.kcal) f.kcal = r0(f.p*4 + f.c*4 + f.f*9); f.tag = tagOf(Object.assign({tag:'other'}, f));
      S.custom.push(f); S.pantry.push(f.id); save(); toast(`${name} added.`); return render(); }
    case 'plan': { const pl = buildPlan(); if (!pl) return; S.plan = pl; save(); sfx('done'); render(); setTimeout(()=>{ const el = $('#planBox'); el && el.scrollIntoView({behavior:'smooth', block:'start'}); }, 30); return; }
    case 'saveSetup': readSetup(); save(true); toast('Profile saved. Targets recalculated.'); return render();
    case 'bkCopy': { const txt = JSON.stringify(S, (k,v) => k === 'apiKey' ? undefined : v); const ta = $('#bk'); ta.value = txt;
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => toast('Backup copied.'), () => { ta.select(); toast('Backup is in the box. Select all and copy.'); }); return; }
    case 'bkLoad': { try { const s = JSON.parse($('#bk').value); if (!s.profile || !s.days) throw 0; S = Object.assign(defaults(), s); save(true); toast('Restored.'); render(); } catch(e){ toast('That is not a FORMA backup.', true); } return; }
    case 'wipe': if (!ui.wipeArm){ ui.wipeArm = true; render(); setTimeout(()=>{ ui.wipeArm = false; }, 4000); return; }
      try { localStorage.removeItem(LS); } catch(e){} S = defaults(); ui.wipeArm = false; save(true); toast('All data erased.'); return go('stat');
  }
}

/* ════════════════ BOOT ════════════════ */
function clock(){ const d = new Date(); $('#lcdTime').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (d.getHours() === 0 && d.getMinutes() === 0 && !clock.rolled){ clock.rolled = true; finalizePast(); render(); } if (d.getMinutes() !== 0) clock.rolled = false; }
function noise(){
  const c = $('#noise'); if (!c) return; const x = c.getContext('2d'); const w = c.width = 160, h = c.height = 240;
  const img = x.createImageData(w, h); const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const draw = () => { for (let i = 0; i < img.data.length; i += 4){ const v = Math.random()*255|0; img.data[i] = img.data[i+1] = img.data[i+2] = v; img.data[i+3] = 255; } x.putImageData(img, 0, 0); };
  draw(); if (!reduce) setInterval(draw, 90);
}
function boot(){
  document.documentElement.dataset.phos = P().phos;
  finalizePast(); render(); clock(); setInterval(clock, 15000); noise();
  const el = $('#boot');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let seen = false; try { seen = sessionStorage.getItem('forma.boot') === '1'; sessionStorage.setItem('forma.boot','1'); } catch(e){}
  if (seen || reduce){ el.remove(); return; }
  const t = targets(), L = lv();
  const lines = ['FORMA FIELD TERMINAL  F-01', 'PHYSIQUE PROTOCOL ......... LOADED', 'NUTRITION PROTOCOL ........ LOADED',
    `OPERATOR ................. ${wDisp(P().weightKg)} ${wUnit().toUpperCase()}`, `CONDITIONING LEVEL ........ ${L.name}`,
    `DAILY RATION .............. ${fmt(t.kcal)} KCAL / ${t.p} G PROTEIN`, `TODAY ..................... ${SESSIONS[sessionFor(today())].name}`, '', 'SCORE RESET TO 100. HOLD THE LINE.'];
  el.innerHTML = '<div class="logo">FORMA</div><div id="bootTxt"></div><span class="blink">█</span>';
  const tx = $('#bootTxt'); let i = 0;
  const step = () => { if (!el.isConnected) return; if (i < lines.length){ tx.textContent += lines[i++] + '\n'; setTimeout(step, 120); } else setTimeout(() => el.remove(), 650); };
  setTimeout(step, 200);
  el.addEventListener('click', () => el.remove());
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ finalizePast(); render(); } else save(true); });
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
